name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches:
    - '**'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.12']
        edx_branch: ['master', 'release/teak', 'release/ulmo']
        toxenv: [py312-django42, py312-django52]

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: tox install
        run: pip install tox

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: tox

      - name: Upload coverage to CodeCov
        if: matrix.python-version == '3.12' && matrix.toxenv == 'py312-django42'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Install tutor
        run: |
          if [[ "${{ matrix.edx_branch }}" == "master" ]]; then
            git clone --branch=main https://github.com/overhangio/tutor.git
            pip install -e "./tutor"
          elif [[ "${{ matrix.edx_branch }}" == "release/ulmo" ]]; then
            pip install "tutor>=21.0.0,<22.0.0"
          else
            pip install "tutor>=20.0.0,<21.0.0"
          fi

      - name: Set up tutor with edx-platform
        id: tutor
        env:
          EDX_BRANCH: ${{ matrix.edx_branch }}
        run: |
          set -euo pipefail
          cd ..
          git clone https://github.com/openedx/edx-platform
          cd edx-platform
          git checkout "$EDX_BRANCH"

          # Tutor from git main pins its own upcoming release branch, not
          # edx-platform master, so pin that leg or the image's baked
          # dependencies drift from the mounted code. Release legs keep
          # Tutor's default, which tracks the matching release line.
          if [[ "$EDX_BRANCH" == "master" ]]; then
            tutor config save --set OPENEDX_COMMON_VERSION="$EDX_BRANCH"
          fi

          tutor mounts add .
          tutor dev launch --non-interactive
          tutor dev stop

          # Ask Tutor where its root is rather than assuming. The directory is
          # named after __app__, which picks up __version_suffix__ ("tutor-main"
          # when the main branch carries a suffix, plain "tutor" when it does
          # not, as happens on release day). Hardcoding either spelling breaks
          # the moment upstream flips it.
          tutor_root="$(tutor config printroot)"
          compose_project="$(basename "$tutor_root" | tr '-' '_')_dev"
          {
            echo "tutor_root=$tutor_root"
            echo "compose_project=$compose_project"
          } >> "$GITHUB_OUTPUT"

      - name: Run Integration Tests
        env:
          TUTOR_ROOT_DIR: ${{ steps.tutor.outputs.tutor_root }}
          COMPOSE_PROJECT: ${{ steps.tutor.outputs.compose_project }}
        run: |
          set -euo pipefail
          EDX_WORKSPACE="$PWD/.." docker compose \
            -f "$TUTOR_ROOT_DIR/env/local/docker-compose.yml" \
            -f "$TUTOR_ROOT_DIR/env/dev/docker-compose.yml" \
            --project-name "$COMPOSE_PROJECT" \
            run -v "$PWD/../edx-sga:/edx-sga" \
            lms /edx-sga/run_edx_integration_tests.sh

      - name: Upload coverage to CodeCov
        if: matrix.python-version == '3.12' && matrix.toxenv == 'py312-django42'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
