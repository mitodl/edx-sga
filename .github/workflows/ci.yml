name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches:
    - '**'

permissions:
  contents: read

concurrency:
  # Every master run gets a group of its own. GitHub replaces a queued run
  # with any newer run in the same group, and a release run that was replaced
  # would never publish: only the push that changes the version does (see
  # detect-release). Other refs share one group per ref and cancel superseded
  # runs.
  group: "${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.12']
        edx_branch: ['master', 'release/teak', 'release/ulmo']
        toxenv: [py312-django42, py312-django52]

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: tox install
        run: pip install tox

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: tox

      - name: Upload coverage to CodeCov
        if: matrix.python-version == '3.12' && matrix.toxenv == 'py312-django42'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Install tutor
        run: |
          if [[ "${{ matrix.edx_branch }}" == "master" ]]; then
            git clone --branch=main https://github.com/overhangio/tutor.git
            pip install -e "./tutor"
          elif [[ "${{ matrix.edx_branch }}" == "release/ulmo" ]]; then
            pip install "tutor>=21.0.0,<22.0.0"
          else
            pip install "tutor>=20.0.0,<21.0.0"
          fi

      - name: Set up tutor with edx-platform
        id: tutor
        env:
          EDX_BRANCH: ${{ matrix.edx_branch }}
        run: |
          set -euo pipefail
          cd ..
          git clone https://github.com/openedx/edx-platform
          cd edx-platform
          git checkout "$EDX_BRANCH"

          # Tutor from git main pins its own upcoming release branch, not
          # edx-platform master, so pin that leg or the image's baked
          # dependencies drift from the mounted code. Release legs keep
          # Tutor's default, which tracks the matching release line.
          if [[ "$EDX_BRANCH" == "master" ]]; then
            tutor config save --set OPENEDX_COMMON_VERSION="$EDX_BRANCH"
          fi

          tutor mounts add .
          tutor dev launch --non-interactive
          tutor dev stop

          # Ask Tutor where its root is rather than assuming. The directory is
          # named after __app__, which picks up __version_suffix__ ("tutor-main"
          # when the main branch carries a suffix, plain "tutor" when it does
          # not, as happens on release day). Hardcoding either spelling breaks
          # the moment upstream flips it.
          tutor_root="$(tutor config printroot)"
          compose_project="$(basename "$tutor_root" | tr '-' '_')_dev"
          {
            echo "tutor_root=$tutor_root"
            echo "compose_project=$compose_project"
          } >> "$GITHUB_OUTPUT"

      - name: Run Integration Tests
        env:
          TUTOR_ROOT_DIR: ${{ steps.tutor.outputs.tutor_root }}
          COMPOSE_PROJECT: ${{ steps.tutor.outputs.compose_project }}
        run: |
          set -euo pipefail
          EDX_WORKSPACE="$PWD/.." docker compose \
            -f "$TUTOR_ROOT_DIR/env/local/docker-compose.yml" \
            -f "$TUTOR_ROOT_DIR/env/dev/docker-compose.yml" \
            --project-name "$COMPOSE_PROJECT" \
            run -v "$PWD/../edx-sga:/edx-sga" \
            lms /edx-sga/run_edx_integration_tests.sh

      - name: Upload coverage to CodeCov
        if: matrix.python-version == '3.12' && matrix.toxenv == 'py312-django42'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # A release is a push to master that changes the version in
  # edx_sga/__init__.py: once the tests pass, that version is built, published
  # with Trusted Publishing, and tagged, unless PyPI already has it.
  #
  # Only the push that changes the version publishes it. A later push still
  # carries the unpublished version but publishes nothing, because building it
  # would ship that push's unrelated changes under the release's version and
  # tag. If a release run fails, re-run its failed jobs.
  detect-release:
    needs: python-tests
    name: Detect an unpublished version
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.detect.outputs.version }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # setup.py takes its version from here.
          version="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' edx_sga/__init__.py)"
          if [ -z "$version" ]; then
            echo "::error::No __version__ found in edx_sga/__init__.py."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          git fetch --no-tags --depth=1 origin "$BEFORE"
          previous="$(git show "${BEFORE}:edx_sga/__init__.py" \
            | sed -n 's/^__version__ = "\([^"]*\)"$/\1/p')"
          if [ "$previous" = "$version" ]; then
            echo "This push leaves the version at ${version}; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "This push changes the version from ${previous:-<none>} to ${version}."

          status="$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/edx-sga/${version}/json")"
          case "$status" in
            200)
              echo "edx-sga ${version} is already on PyPI; nothing to publish."
              echo "found=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "edx-sga ${version} is not on PyPI; publishing it."
              echo "found=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI returned HTTP ${status} for edx-sga ${version}."
              exit 1
              ;;
          esac

  publish:
    needs: detect-release
    name: Publish edx-sga ${{ needs.detect-release.outputs.version }}
    runs-on: ubuntu-24.04
    if: needs.detect-release.outputs.found == 'true'
    environment: pypi
    permissions:
      contents: write   # create the release tag
      id-token: write   # PyPI Trusted Publishing
    # Serialize releases so two overlapping pushes cannot both decide the same
    # version is unpublished and race each other to upload it.
    concurrency:
      group: publish-edx-sga-${{ needs.detect-release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          set -euo pipefail
          uv build --out-dir dist
          ls dist
          # Fail rather than upload something other than the version detected.
          test -f "dist/edx_sga-${VERSION}-py3-none-any.whl"
          test -f "dist/edx_sga-${VERSION}.tar.gz"

      - name: Publish to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Tolerate a version that reached PyPI after the detect step.
          skip-existing: true

      # A missing or mismatched Trusted Publisher does not fail the OIDC token
      # exchange; the upload fails with a 403 that does not say where the
      # publisher has to be added.
      - name: Explain a failed upload
        if: failure() && steps.publish.outcome == 'failure'
        env:
          README_URL: ${{ github.server_url }}/${{ github.repository }}/blob/master/README.md#pypi-trusted-publishing
        run: |
          echo "::error::If the upload failed with '403 Invalid API Token: OIDC" \
            "scoped token is not valid', no Trusted Publisher on edx-sga matches all" \
            "of: owner mitodl, repository edx-sga, workflow ci.yml, environment pypi." \
            "Add one at https://pypi.org/manage/project/edx-sga/settings/publishing/" \
            "and re-run this job. See ${README_URL}"

      # Tagging last means a tag always records something that really reached
      # PyPI, instead of being left behind by a failed build or upload.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: v${{ needs.detect-release.outputs.version }}
        run: |
          if gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi

          # The package is already on PyPI by this point, and detect-release
          # will not select it again, so a re-run cannot create a missed tag.
          # Retry rather than leave the release permanently untagged.
          for remaining in 2 1 0; do
            if gh api "repos/${REPOSITORY}/git/refs" \
              --raw-field "ref=refs/tags/${TAG}" \
              --raw-field "sha=${SHA}" \
              --silent; then
              exit 0
            fi

            if [ "$remaining" -eq 0 ]; then
              echo "::error::Published ${TAG} but could not create the tag." \
                "Create it with: git tag ${TAG} ${SHA} && git push origin ${TAG}"
              exit 1
            fi

            sleep 5
          done
